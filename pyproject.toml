[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain"
version = "0.2.0"
authors = [
    {name = "Kevin J. Mahon", email = "k.mahon.dev@gmail.com"}
]
description = "A Zettelkasten-style note taking CLI with encrypted git sync."
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "cryptography >= 42",
    "PyYAML >= 6",
    "numpy >= 1.26",
]

[project.optional-dependencies]
dev = ["pytest >= 8"]

[project.scripts]
sb = "secondbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secondbrain = ["nvim/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
